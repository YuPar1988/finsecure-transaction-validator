apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: finsecure-app
  namespace: finsecure
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: transaction-validator
  namespaceSelector:
    matchNames: ["finsecure"]
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
      honorLabels: true
