# Reference only - shows which keys the application expects.
# Do not put real values in this file. Create the secret from the command line instead:
#
#   kubectl -n finsecure create secret generic finsecure-secrets \
#     --from-literal=DB_USERNAME=finsecure \
#     --from-literal=DB_PASSWORD='<strong-password>' \
#     --from-literal=ADMIN_USERNAME=admin \
#     --from-literal=ADMIN_PASSWORD='<strong-password>'
#
apiVersion: v1
kind: Secret
metadata:
  name: finsecure-secrets
  namespace: finsecure
type: Opaque
stringData:
  DB_USERNAME: finsecure
  DB_PASSWORD: REPLACE_ME
  ADMIN_USERNAME: admin
  ADMIN_PASSWORD: REPLACE_ME
